; Teletype RP2040 firmware — Arduino-Pico core with TinyUSB MIDI.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.arduino.earlephilhower.usb_manufacturer = Teletype
board_build.arduino.earlephilhower.usb_product = Teletype
build_flags =
  -DUSE_TINYUSB
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -DPICO_STDIO_USB_ENABLE_RESET_VIA_BAUD_RATE=1
  -DPICO_STDIO_USB_ENABLE_RESET_VIA_VENDOR_INTERFACE=1
upload_protocol = picotool
upload_flags = -f

lib_deps =
  adafruit/Adafruit TinyUSB Library@^3.3.3
  adafruit/Adafruit NeoPixel
  fortyseveneffects/MIDI Library@^5.0.2
